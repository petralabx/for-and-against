# One roll-up check per repo (TASK-3902): the one org ruleset requires `ci` in
# every repo instead of each repo's job names. This repo has no build or test
# suite, so `ci` rolls up a workflow-syntax check. Add any new required job to
# the `needs` list of `ci` in the same PR.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: workflows parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every workflow file is valid YAML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob(".github/workflows/*.y*ml")):
              try:
                  yaml.safe_load(open(f))
                  print("ok", f)
              except Exception as e:
                  print("::error file=%s::%s" % (f, e)); bad = 1
          sys.exit(bad)
          PY

  ci:
    name: ci
    if: always()
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")' > /dev/null
