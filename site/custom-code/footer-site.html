<!--
  Site-wide footer custom code (Webflow Site Settings → Custom Code → Footer).
  Installed: 2026-08-18. Keeps existing scent-tab underline script and adds
  visible breadcrumbs + BreadcrumbList JSON-LD when the page has none.
  Source of truth: site/custom-code/footer-site.html
-->
<script>
document.querySelectorAll('.scent-tab-link').forEach(link => {
  if (link.href === window.location.href) {
    link.style.borderBottom = '2px solid #1a1a1a';
  } else {
    link.style.borderBottom = 'none';
  }
});
</script>
<script>
(function () {
  var ORIGIN = 'https://forandagainstbodycare.com';
  var SCENTS = {
    'amber-sandalwood': 'Amber & Sandalwood',
    'bergamot-hinoki': 'Bergamot & Hinoki',
    'santal-vetiver': 'Santal & Vetiver'
  };
  var PAGES = {
    shop: 'Shop',
    'best-sellers': 'Best Sellers',
    contact: 'Contact',
    'returns-shipping': 'Returns & Shipping',
    'privacy-policy': 'Privacy Policy',
    'terms-conditions': 'Terms & Conditions'
  };
  var path = (location.pathname.replace(/\/+$/, '') || '/');
  if (path === '/') return;

  var crumbs = [{ name: 'Home', url: ORIGIN + '/' }];
  var parts = path.split('/').filter(Boolean);
  if (parts[0] === 'scents' && parts[1]) {
    crumbs.push({
      name: SCENTS[parts[1]] || parts[1].replace(/-/g, ' '),
      url: ORIGIN + '/scents/' + parts[1]
    });
  } else if (parts[0] === 'products' && parts[1]) {
    crumbs.push({ name: 'Shop', url: ORIGIN + '/shop' });
    crumbs.push({
      name: document.title.replace(/\s*\|\s*For & Against\s*$/, '').trim() || parts[1].replace(/-/g, ' '),
      url: ORIGIN + '/products/' + parts[1]
    });
  } else if (PAGES[parts[0]] && parts.length === 1) {
    crumbs.push({ name: PAGES[parts[0]], url: ORIGIN + '/' + parts[0] });
  } else {
    return;
  }

  var nav = document.querySelector('.navbar-3');
  if (nav && nav.parentNode) {
    var bar = document.createElement('nav');
    bar.className = 'fa-breadcrumbs';
    bar.setAttribute('aria-label', 'Breadcrumb');
    var ol = document.createElement('ol');
    crumbs.forEach(function (crumb, i) {
      var li = document.createElement('li');
      if (i < crumbs.length - 1) {
        var a = document.createElement('a');
        a.href = crumb.url;
        a.textContent = crumb.name;
        li.appendChild(a);
      } else {
        var span = document.createElement('span');
        span.setAttribute('aria-current', 'page');
        span.textContent = crumb.name;
        li.appendChild(span);
      }
      ol.appendChild(li);
    });
    bar.appendChild(ol);
    nav.parentNode.insertBefore(bar, nav.nextSibling);
  }

  if (!document.querySelector('script[type="application/ld+json"]')) {
    var data = {
      '@context': 'https://schema.org',
      '@type': 'BreadcrumbList',
      itemListElement: crumbs.map(function (crumb, i) {
        return {
          '@type': 'ListItem',
          position: i + 1,
          name: crumb.name,
          item: crumb.url
        };
      })
    };
    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.textContent = JSON.stringify(data);
    document.head.appendChild(script);
  }
})();
</script>
